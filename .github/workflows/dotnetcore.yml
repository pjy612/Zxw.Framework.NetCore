name: .NET Core

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore
      run: dotnet restore Zxw.Framework.NetCore.sln
    - name: Build
      run: dotnet build Zxw.Framework.NetCore.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test Zxw.Framework.UnitTest/Zxw.Framework.UnitTest.csproj --configuration Release --no-build --verbosity minimal --filter "FullyQualifiedName~SqlIdentifier|FullyQualifiedName~UnitOfWork|FullyQualifiedName~JsonConvertor|FullyQualifiedName~WebContext|FullyQualifiedName~OrcaRouter"
    - name: Pack
      run: |
        dotnet pack "Zxw.Framework.NetCore/Zxw.Framework.NetCore.csproj" --configuration Release --no-build -p:PackageVersion=7.0.0 --output nupkgs
        dotnet pack "Zxw.Framework.AI/Zxw.Framework.AI.csproj" --configuration Release --no-build -p:PackageVersion=1.0.0 --output nupkgs
